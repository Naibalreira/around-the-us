<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Ao Redor dos EUA: compartilhe fotos dos seus lugares favoritos nos Estados Unidos."
    />
    <meta name="author" content="Naiara Sousa Soares" />
    <meta
      name="keywords"
      content="Ao Redor dos EUA, Around the US, fotos, viagens, lugares, TripleTen"
    />
    <title>Ao Redor dos EUA</title>
    <link rel="icon" href="./images/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./pages/index.css" />
  </head>

  <body class="page">
    <div class="page__container">
      <header class="header">
        <img
          class="header__logo"
          src="./images/logo.svg"
          alt="Logotipo Ao Redor dos EUA"
        />
      </header>

      <main class="content">
        <section class="profile">
          <img
            class="profile__avatar"
            src="./images/avatar.svg"
            alt="Foto de perfil"
          />
          <div class="profile__info">
            <div class="profile__name-row">
              <h1 class="profile__name">Jacques Cousteau</h1>
              <button
                class="profile__edit-button"
                type="button"
                aria-label="Editar perfil"
              ></button>
            </div>
            <p class="profile__description">Explorador</p>
          </div>
          <button
            class="profile__add-button"
            type="button"
            aria-label="Adicionar novo local"
          ></button>
        </section>

        <section class="cards" aria-label="Lugares">
          <ul class="cards__list"></ul>
        </section>
      </main>

      <footer class="footer">
        <p class="footer__copyright">&copy; 2026 Ao Redor dos EUA</p>
      </footer>
    </div>

    <!-- Pop-up: Editar perfil -->
    <div class="popup" id="edit-popup">
      <div class="popup__content">
        <button
          class="popup__close"
          type="button"
          aria-label="Fechar"
        ></button>
        <h2 class="popup__title">Editar perfil</h2>
        <form
          class="popup__form"
          id="edit-profile-form"
          name="edit-profile-form"
          novalidate
        >
          <label class="popup__field">
            <input
              class="popup__input popup__input_type_name"
              id="profile-name"
              name="name"
              type="text"
              placeholder="Nome"
              minlength="2"
              maxlength="40"
              required
            />
            <span class="popup__error" id="profile-name-error"></span>
          </label>
          <label class="popup__field">
            <input
              class="popup__input popup__input_type_description"
              id="profile-description"
              name="description"
              type="text"
              placeholder="Sobre mim"
              minlength="2"
              maxlength="200"
              required
            />
            <span class="popup__error" id="profile-description-error"></span>
          </label>
          <button class="popup__button" type="submit">Salvar</button>
        </form>
      </div>
    </div>

    <!-- Pop-up: Novo local -->
    <div class="popup" id="new-card-popup">
      <div class="popup__content">
        <button
          class="popup__close"
          type="button"
          aria-label="Fechar"
        ></button>
        <h2 class="popup__title">Novo local</h2>
        <form
          class="popup__form"
          id="new-card-form"
          name="new-card-form"
          novalidate
        >
          <label class="popup__field">
            <input
              class="popup__input popup__input_type_card-name"
              id="card-name"
              name="place-name"
              type="text"
              placeholder="Título"
              minlength="2"
              maxlength="30"
              required
            />
            <span class="popup__error" id="card-name-error"></span>
          </label>
          <label class="popup__field">
            <input
              class="popup__input popup__input_type_url"
              id="card-link"
              name="link"
              type="url"
              placeholder="Link de imagem"
              required
            />
            <span class="popup__error" id="card-link-error"></span>
          </label>
          <button class="popup__button" type="submit">Salvar</button>
        </form>
      </div>
    </div>

    <!-- Pop-up: Imagem ampliada -->
    <div class="popup popup_type_image" id="image-popup">
      <div class="popup__content popup__content_content_image">
        <button
          class="popup__close"
          type="button"
          aria-label="Fechar"
        ></button>
        <img class="popup__image" src="#" alt="" />
        <p class="popup__caption"></p>
      </div>
    </div>

    <!-- Template do cartão -->
    <template id="card-template">
      <li class="card">
        <img class="card__image" src="#" alt="" />
        <button
          class="card__delete-button"
          type="button"
          aria-label="Excluir cartão"
        ></button>
        <div class="card__description">
          <h2 class="card__title"></h2>
          <button
            class="card__like-button"
            type="button"
            aria-label="Curtir"
          ></button>
        </div>
      </li>
    </template>

    <script src="./scripts/validate.js"></script>
    <script src="./scripts/index.js"></script>
  </body>
</html>
